# Netlify continuous deployment configuration
# Netlify runs this build on every push to the connected GitHub repository.

[build]
  # Production build generated by Parcel (see package.json scripts)
  command = "npm run build"
  # Folder Parcel outputs to and Netlify serves at the domain root
  publish = "dist"

[build.environment]
  # Pin an LTS Node version for reproducible builds
  NODE_VERSION = "20"
